name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make sure SDK 35 is present
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List build outputs
        if: always()
        run: |
          echo "----- everything under app/build/outputs -----"
          find app/build/outputs -type f 2>/dev/null || echo "(outputs dir doesn't exist - nothing was produced)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wirdy-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
